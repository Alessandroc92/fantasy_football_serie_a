[project]
name = "fantasy_football"
version = "0.1.0"
description = "A project to extract via webscraping and save data related to Fantasy Football for Serie A."
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "bs4>=0.0.2",
    "niquests>=3.21.0",
    "psycopg2>=2.9.12",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.39",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_football_scraper"]
